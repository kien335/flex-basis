
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực hành CSS Flex Basis</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Thực hành CSS flex-basis</h1>

    <h2>Ví dụ 1: flex-basis với px</h2>
    <div class="container example1">
        <div class="item item1">Item 1 - 200px</div>
        <div class="item item2">Item 2 - 100px</div>
        <div class="item item3">Item 3 - 150px</div>
    </div>

    <h2>Ví dụ 2: flex-direction: column</h2>
    <div class="container example2">
        <div class="item">Item 1</div>
        <div class="item">Item 2</div>
        <div class="item">Item 3</div>
    </div>

    <h2>Ví dụ 3: flex-basis với %</h2>
    <div class="container example3">
        <div class="item">Item 1 - 50%</div>
        <div class="item">Item 2 - 50%</div>
    </div>

    <h2>Ví dụ 4: flex-basis và flex-grow</h2>
    <div class="container example4">
        <div class="item item1">Item 1 - Grow 1</div>
        <div class="item item2">Item 2 - Grow 2</div>
        <div class="item item3">Item 3 - Grow 1</div>
    </div>
</body>
</html>
